<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FigmaCN · API 设置</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main class="options">
    <header>
      <img src="img/icon-48.png" width="32" height="32" alt="">
      <div><h1>FigmaCN</h1><p>图层译写</p></div>
    </header>
    <h2>API 设置</h2>
    <p class="intro">保存后，重新打开侧栏或浏览器都能继续翻译。</p>
    <form id="settings-form">
      <label for="provider">API 服务</label>
      <select id="provider">
        <option value="deepseek">DeepSeek</option>
        <option value="gemini">Gemini</option>
        <option value="openai">OpenAI</option>
      </select>
      <label for="model">模型</label>
      <input id="model" spellcheck="false" required>
      <label for="api-key">API Key</label>
      <input id="api-key" type="password" placeholder="输入所选服务的 API Key" autocomplete="off">
      <p class="note">Key 保存在当前浏览器的扩展存储中，不会随账号同步。本地存储未加密。</p>
      <div class="actions">
        <button type="submit" id="save" class="primary" disabled>保存设置</button>
        <button type="button" id="forget" disabled>清除已保存的 Key</button>
      </div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="js/options.js"></script>
</body>
</html>
